name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
      - run: npm run audit:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: npm run audit:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: quality/lighthouse/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: quality/screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            quality/
            test-results/
          if-no-files-found: warn
  model-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r examples/requirements.txt
      - run: python examples/generate_model.py
  external-links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:external-links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-link-report
          path: quality/external-links.json
          if-no-files-found: warn
